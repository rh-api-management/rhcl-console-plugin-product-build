apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rh-api-management/rhcl-console-plugin-product-build?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "rhcl-1.5" && ("console-plugin-0.6.0".pathChanged() || "console-plugin-0.6.0/*".pathChanged() || "Containerfile.console-plugin-0.6.0".pathChanged() || "yarn-install/*".pathChanged() || ".yarnrc.yml".pathChanged() || "rpms.in.yaml".pathChanged() || "rpms.lock.yaml".pathChanged() || "redhat.repo".pathChanged() || "ubi.repo".pathChanged() || ".tekton/multi-arch-build-pipeline.yaml".pathChanged() || ".tekton/rhcl-1-5-rhcl-console-plugin-0-6-0-push.yaml".pathChanged())
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: rhcl-1-5-rhcl-operator
    appstudio.openshift.io/component: rhcl-1-5-rhcl-console-plugin-0-6-0
    pipelines.appstudio.openshift.io/type: build
  name: rhcl-1-5-rhcl-console-plugin-0-6-0-on-push
  namespace: api-management-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/api-management-tenant/rhcl-1-5-rhcl-console-plugin-0-6-0:{{revision}}
  - name: dockerfile
    value: Containerfile.console-plugin-0.6.0
  - name: prefetch-input
    value: '[{"type": "rpm", "path": "."}, {"type": "npm", "path": "./yarn-install"}, {"type": "yarn", "path": "./console-plugin-0.6.0"}]'
  pipelineRef:
    name: build-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhcl-1-5-rhcl-console-plugin-0-6-0
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
